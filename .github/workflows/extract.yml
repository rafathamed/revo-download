name: Extract REVO source archive
on:
  push:
    paths:
      - ".github/workflows/extract.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          unzip -q REVO-Download-v1.0.11-source-fixed.zip -d "$tmp"
          rm -rf "$tmp/REVO-Download/.github"
          cp -a "$tmp/REVO-Download/." .
          chmod +x tools/ffmpeg/build.sh
          rm -f REVO-Download-v1.0.11-source-fixed.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add REVO Download v1.0.11 source"
          git push origin HEAD:main
